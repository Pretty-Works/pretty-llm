[project]
name = "pretty-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    # LangChain
    "langchain >= 1.2.18",
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langchain-chroma",
    "langchain-text-splitters",
    "langgraph",
    "langsmith",
    "langchain-tavily",
    "python-dotenv",
    "pydantic",
    "pandas",
    "matplotlib",
    "streamlit",
    "requests",
    "beautifulsoup4",
    "mcp",
    "ipykernel>=7.2.0",
    "deepagents>=0.5.3",
    "langchain-mcp-adapters>=0.2.2",
    "arxiv>=3.0.0",
    "pymupdf>=1.27.2.2",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "pytz>=2026.1.post1",
    "google-search-results>=2.4.2",
    "numexpr>=2.14.1",
    "pdfplumber>=0.11.9",
    "pypdf>=6.13.1",
    "faiss-cpu>=1.14.2",
    "langgraph-supervisor>=0.0.31",
    "langchain-experimental>=0.4.1",
    "openevals>=0.2.0",
    "agentevals>=0.0.9",
    # ── AI 서버(FastAPI) ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.5.0",
    # ── Gmail MCP 서버 (mcp_servers/gmail_mcp) ──
    "cryptography>=42.0.0",   # 저장된 refresh_token/access_token 암호화
    "itsdangerous>=2.2.0",    # OAuth state 파라미터 서명/검증
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# app.* 를 임포트할 수 있도록 프로젝트 루트를 sys.path 에 넣는다.
pythonpath = ["."]
testpaths = ["app/tests"]
asyncio_mode = "auto"
